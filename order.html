<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="pm.css"/>
<title>Order a Unit | Prolific</title><meta name="robots" content="noindex"/>
</head><body>
<nav><a class="nl" href="index.html"><img src="logo.jpg" alt="Prolific"/><span>Prolific</span></a><a class="nb" href="order.html">Order a Unit</a></nav>
<section class="wrap">
  <div class="eye">Order a Unit</div>
  <h1>Order a <em>shoot.</em></h1>
  <p class="lead">Photos and a 3D tour, delivered in one link within 48 hours of the shoot. Billed on your monthly invoice.</p>
  <div class="for hidden" id="for">Ordering for <b id="forName"></b></div>
  <form name="unit-order" method="POST" data-netlify="true" netlify-honeypot="bot" action="order-thanks.html">
    <input type="hidden" name="form-name" value="unit-order"/><p class="hidden"><label>Leave empty <input name="bot"/></label></p>
    <input type="hidden" name="client_link" id="clientLink"/>
    <div class="row"><div><label>Company</label><input name="company" id="company" required/></div><div><label>Your Name</label><input name="name" required/></div></div>
    <div class="row"><div><label>Email</label><input type="email" name="email" required/></div><div><label>Phone</label><input type="tel" name="phone" required/></div></div>
    <div><label>Property Address</label><input name="address" required placeholder="Street, city, ZIP"/></div>
    <div class="row"><div><label>Unit #</label><input name="unit"/></div><div><label>Beds / Baths</label><input name="beds_baths" placeholder="e.g. 3 / 2"/></div></div>
    <div class="row"><div><label>Vacant?</label><select name="vacant"><option>Vacant</option><option>Occupied (tenant notified)</option></select></div><div><label>Access</label><select name="access"><option>Lockbox</option><option>Pick up key at office</option><option>Someone will meet us</option><option>Tenant will let us in</option></select></div></div>
    <div><label>Access Details</label><input name="access_details" placeholder="Lockbox location, who to call on arrival"/><p class="note">Sent privately to Prolific only.</p></div>
    <div class="row"><div><label>Preferred Date</label><input type="date" name="date_1" required/></div><div><label>Backup Date</label><input type="date" name="date_2"/></div></div>
    <div><label>Add-ons</label><select name="addons"><option>None</option><option>Floor plan</option><option>Video</option><option>Floor plan + video</option></select></div>
    <div><label>Notes</label><textarea name="notes" placeholder="Anything different from your usual shot list"></textarea></div>
    <div><button class="btn dark" type="submit">Place Order</button></div>
  </form>
</section>
<footer><span>Prolific · Curated Property Experiences</span><span>South Florida · Keys to Port St. Lucie</span><a href="index.html">Back to site</a></footer>
<script>
(function(){var c=new URLSearchParams(location.search).get('c');if(!c)return;var n=c.replace(/-/g,' ').replace(/\b\w/g,function(m){return m.toUpperCase();});
document.getElementById('company').value=n;document.getElementById('clientLink').value=c;document.getElementById('forName').textContent=n;document.getElementById('for').classList.remove('hidden');})();
</script>
</body></html>
